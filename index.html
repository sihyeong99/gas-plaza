<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>점곡 기체 광장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* 블록 장난감 느낌: 진한 남색 테두리 + 아래로 두꺼운 그림자, 기체마다 고유한 색 */
:root{
  --ink:#1b2340; --paper:#fffdf5; --sun:#ffc824; --grass:#4fbf4a; --hot:#ff4f6e; --muted:#5d6685;
  --display:"Jua","Malgun Gothic",sans-serif; --body:"Gowun Dodum","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#8fd8ff;overflow:hidden;font-family:var(--body);color:var(--ink);user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hide{display:none!important}
button{font-family:var(--display);color:var(--ink);cursor:pointer;border:3px solid var(--ink);background:#fff;border-radius:12px;box-shadow:0 4px 0 var(--ink);padding:9px 14px;font-size:17px;transition:transform .06s,box-shadow .06s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
button.go{background:var(--sun);font-size:22px;padding:12px 26px}
button:disabled{opacity:.45;cursor:default}

/* 꾸미기 */
#avatar{position:fixed;top:0;right:0;bottom:0;width:min(440px,56vw);background:var(--paper);border-left:5px solid var(--ink);padding:16px 18px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;z-index:20}
#avatar h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1;margin:0;letter-spacing:-.5px}
#avatar h1 b{font-weight:400;color:#2878e8}
#avatar p{margin:0;font-size:15px;color:var(--muted)}
.row{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center}
.row>label,.row>span{font-family:var(--display);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;font-size:15px;box-shadow:0 2px 0 var(--ink);border-width:2px;border-radius:9px}
.chip.on{background:var(--sun)}
.sw{width:32px;height:32px;padding:0;border-radius:8px;border-width:2px;box-shadow:0 2px 0 var(--ink)}
.sw.on{outline:3px solid var(--hot);outline-offset:1px}
#nick{font-family:var(--display);font-size:18px;border:3px solid var(--ink);border-radius:10px;padding:7px 10px;width:100%;background:#fff;color:var(--ink);user-select:text;-webkit-user-select:text}
.av-foot{display:flex;gap:8px;margin-top:auto;padding-top:6px;align-items:center;flex-wrap:wrap}
.av-foot .go{flex:1}
@media (max-width:640px){#avatar{width:100%;top:38vh;border-left:0;border-top:5px solid var(--ink)}#avatar h1{font-size:30px}}

/* 게임 화면 위 표시 */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud button{pointer-events:auto}
#steps{position:absolute;left:10px;top:10px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px 10px;max-width:min(330px,58vw);box-shadow:0 4px 0 var(--ink)}
#stepchips{display:flex;gap:4px;margin-bottom:5px}
.st{flex:1;min-width:28px;height:26px;border-radius:7px;border:2px solid var(--ink);display:grid;place-items:center;font:15px var(--display);background:#d9dce6;color:#7a8097}
.st.now{background:var(--sun);color:var(--ink);animation:pulse 1s infinite alternate}
.st.done{color:#fff}
@keyframes pulse{to{transform:translateY(-2px)}}
#goal{font-size:14.5px;line-height:1.3;font-weight:700}
#topr{position:absolute;right:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:50vw}
#topr button{font-size:15px;padding:6px 10px}
#net{font:14px var(--display);background:var(--ink);color:#fff;border-radius:10px;padding:8px 10px;align-self:center}
#net.on{background:#16883c}
#compass{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:1px}
#arrow{width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-bottom:34px solid var(--hot);filter:drop-shadow(0 3px 0 var(--ink))}
#dist{font:14px var(--display);background:#fffc;border-radius:7px;padding:1px 7px;white-space:nowrap}
@media (max-width:760px){#compass{top:96px;left:60px}#net{display:none}}
#stick{position:absolute;left:24px;bottom:24px;width:128px;height:128px;border-radius:50%;background:#1b234055;border:3px solid #fff8;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:37px;top:37px;width:48px;height:48px;border-radius:50%;background:#fffd;border:3px solid var(--ink)}
#acts{position:absolute;right:18px;bottom:20px;display:flex;gap:10px;align-items:flex-end}
#acts button{touch-action:none;border-radius:50%}
#bL{width:94px;height:94px;font-size:42px;padding:0;background:#b9ff3c}
#bL.on{background:var(--hot);color:#fff}
#bJ{width:78px;height:78px;font-size:19px;padding:0;background:#7fd0ff}
#bC{width:68px;height:68px;font-size:15px;padding:0;white-space:nowrap}
#chat{position:absolute;right:18px;bottom:190px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:auto}
#chat button{font-size:15px;padding:6px 11px;background:var(--paper)}
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:14px;background:#1b2340cc;color:#fff;padding:5px 12px;border-radius:9px;white-space:nowrap}
@media (max-width:900px),(pointer:coarse){#hint{display:none}}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:var(--ink);color:#fff;font:21px var(--display);padding:10px 20px;border-radius:12px;text-align:center;max-width:86vw;opacity:0;transition:opacity .2s;box-shadow:0 5px 0 #0006}
#toast.on{opacity:1}

/* 카드와 문제 */
.veil{position:fixed;inset:0;background:#1b234099;display:grid;place-items:center;z-index:30;padding:12px}
.panel{background:var(--paper);border:5px solid var(--ink);border-radius:20px;padding:18px 22px;width:min(560px,100%);max-height:96%;overflow-y:auto;box-shadow:0 8px 0 var(--ink);display:flex;flex-direction:column;gap:10px}
.panel h2{font-family:var(--display);font-weight:400;font-size:29px;margin:0;line-height:1.1;text-wrap:balance}
.panel p{margin:0;font-size:19px;line-height:1.45;font-weight:700}
.tag{align-self:flex-start;font:15px var(--display);padding:3px 10px;border-radius:8px;color:#fff;border:2px solid var(--ink)}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;flex-wrap:wrap}
.choice{display:block;width:100%;text-align:left;font-size:19px;margin-bottom:9px;line-height:1.3;font-family:var(--body);font-weight:700;padding:11px 14px}
.choice.no{background:#ffc9d2;opacity:.75;text-decoration:line-through}
.choice.yes{background:#a8f0ae}
#qinfo{font-size:17px;min-height:25px;color:#a8213c}
#qinfo.good{color:#0e7a37}
#gamebox .panel{width:min(780px,100%);padding:10px 14px;gap:6px}
#gamebox h2{font-size:24px}
#gc{width:100%;aspect-ratio:720/420;background:#000;border:3px solid var(--ink);border-radius:10px;touch-action:none;display:block}
#gsay{font-size:17px;font-weight:700;min-height:24px;line-height:1.3}
#gamebox .bar{display:flex;gap:10px;align-items:center;justify-content:space-between}
#gsay{flex:1}
#gNext{white-space:nowrap;font-size:19px}
#book table{border-collapse:collapse;width:100%;font-size:15.5px;line-height:1.3}
#book td,#book th{border:2px solid var(--ink);padding:6px 8px;text-align:left;vertical-align:top}
#book th{font-family:var(--display);font-weight:400;background:#ffe9a3}
#book .gn{font-family:var(--display);font-size:18px;color:#fff;white-space:nowrap}
#fail{position:fixed;inset:0;display:none;place-items:center;background:var(--paper);padding:24px;z-index:99;font-size:20px;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hide">
  <div id="steps"><div id="stepchips"></div><div id="goal"></div></div>
  <div id="compass"><div id="arrow"></div><div id="dist"></div></div>
  <div id="topr">
    <span id="net">연결 중</span>
    <button id="bBook">기체 수첩</button>
    <button id="bSnd">소리 끄기</button>
    <button id="bLook">꾸미기</button>
  </div>
  <div id="stick"><div id="knob"></div></div>
  <div id="chat" class="hide"></div>
  <div id="acts">
    <button id="bC">말하기</button>
    <button id="bJ">점프</button>
    <button id="bL" title="L 키">L</button>
  </div>
  <div id="hint">방향키나 W A S D로 걷기 · 스페이스 점프 · L 춤 · 화면을 끌면 시점 돌리기</div>
  <div id="toast"></div>
</div>

<div id="avatar" class="hide">
  <h1>점곡 <b>기체</b> 광장</h1>
  <p>나만의 캐릭터를 꾸미고 광장으로 들어가 봅시다.</p>
  <div class="row"><label for="nick">별명</label><input id="nick" maxlength="8" placeholder="진짜 이름은 쓰지 않아요" autocomplete="off"></div>
  <div id="opts"></div>
  <div class="av-foot">
    <button id="bRand">아무거나</button>
    <button id="bReset" class="hide">새로 시작</button>
    <button id="bEnter" class="go">광장으로 들어가기</button>
  </div>
</div>

<div id="card" class="veil hide"><div class="panel">
  <span class="tag" id="cTag"></span>
  <h2 id="cTitle"></h2>
  <p id="cText"></p>
  <div class="acts"><button id="cBtn" class="go"></button></div>
</div></div>

<div id="quiz" class="veil hide"><div class="panel">
  <span class="tag" id="qTag"></span>
  <h2 id="qText"></h2>
  <div id="qChoices"></div>
  <div id="qinfo"></div>
  <div class="acts"><button id="qNext" class="go hide">다음</button></div>
</div></div>

<div id="gamebox" class="veil hide"><div class="panel">
  <div class="bar"><h2 id="gTitle"></h2><span class="tag" id="gTag"></span></div>
  <canvas id="gc" width="720" height="420"></canvas>
  <div class="bar"><div id="gsay"></div><button id="gNext" class="go hide">문제 풀러 가기</button></div>
</div></div>

<div id="book" class="veil hide"><div class="panel" style="width:min(760px,100%)">
  <h2>기체 수첩</h2>
  <p style="font-size:16px" id="bookNote"></p>
  <div id="bookBody"></div>
  <div class="acts"><button id="bookClose" class="go">닫기</button></div>
</div></div>

<div id="fail"><div>게임을 불러오지 못했습니다.<br>인터넷 연결을 확인하고 다시 열어 봅시다.</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>

const groundAt=(x,z,y)=>{let g=.03;if(Math.hypot(x,z)<7.1)g=.56;for(const p of platforms)if(Math.abs(x-p.x)<p.hw+.25&&Math.abs(z-p.z)<p.hd+.25&&y>=p.top-.55)g=Math.max(g,p.top);return g};
function step(dt,now){
  let ix=0,iy=0;
  if(!modal&&ui==='play'){
    if(keys.KeyW||keys.ArrowUp)iy+=1;if(keys.KeyS||keys.ArrowDown)iy-=1;if(keys.KeyD||keys.ArrowRight)ix+=1;if(keys.KeyA||keys.ArrowLeft)ix-=1;
    ix+=stick.x;iy+=-stick.y;
  }
  const l=Math.hypot(ix,iy);if(l>1){ix/=l;iy/=l}
  const sp=(S.done[5]?9:6.4)*Math.min(1,l);
  const moving=l>.08;
  if(moving){
    $('hint').classList.add('hide');
    const fx=-Math.sin(camYaw),fz=-Math.cos(camYaw),rx=Math.cos(camYaw),rz=-Math.sin(camYaw);
    const vx=(fx*iy+rx*ix),vz=(fz*iy+rz*ix),n=Math.hypot(vx,vz)||1;
    let nx=me.x+vx/n*sp*dt,nz=me.z+vz/n*sp*dt;
    for(const c of colliders){if(me.y>3&&c.r<2)continue;const d=Math.hypot(nx-c.x,nz-c.z),rr=c.r+.5;if(d<rr&&d>.001){nx=c.x+(nx-c.x)/d*rr;nz=c.z+(nz-c.z)/d*rr}}
    const r=Math.hypot(nx,nz);if(r>67){nx*=67/r;nz*=67/r}
    /* 블록 옆면에 막히기 */
    for(const p of platforms){if(Math.abs(nx-p.x)<p.hw+.3&&Math.abs(nz-p.z)<p.hd+.3&&me.y<p.top-.55){nx=me.x;nz=me.z}}
    me.x=nx;me.z=nz;
    const ty=Math.atan2(vx,vz);let dy=ty-me.yaw;while(dy>Math.PI)dy-=6.2832;while(dy<-Math.PI)dy+=6.2832;me.yaw+=dy*Math.min(1,dt*13);
    if(me.dance)setDance(false);
  }
  const g=groundAt(me.x,me.z,me.y);
  me.vy-=26*dt;me.y+=me.vy*dt;
  if(me.y<=g){if(g-me.y<.7||me.vy<0){me.y=g;me.vy=0;me.onGround=true}}else if(me.y>g+.05)me.onGround=false;
  const c=me.char;c.root.position.set(me.x,me.y,me.z);c.root.rotation.y=me.yaw;
  c.state=me.dance?3:!me.onGround?2:moving?1:0;
  /* 별 */
  if(star){if(!starGot&&Math.hypot(me.x-star.position.x,me.z-star.position.z)<2&&me.y>5){starGot=true;star.visible=false;toast('꼭대기에 올랐습니다! 대단합니다.');sfx([660,880,1320])}}
}

function sched(){if(!ac||ac.state!=='running')return;while(nextT<ac.currentTime+.2){const s=seq%16,bar=Math.floor(seq/16)%4,t=nextT;
  if(s%4===0){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+.18)}

let nb=null;function noise(t,d,v){if(!nb){nb=ac.createBuffer(1,ac.sampleRate*.2,ac.sampleRate);const a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=6000;s.buffer=nb;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(musicGain);s.start(t);s.stop(t+d)}

    if(ok){netState='wait';setNet();setTimeout(tryBroker,2500)}

function gsayText(k){return({bag:'화면을 누르고 있으면 질소가 들어갑니다. 초록 칸에서 손을 떼어 봅시다.',dive:'잠수부를 위아래로 움직여 공기통을 7개 모아 봅시다. 산소가 떨어지면 안 됩니다.',fire:'불이 난 곳을 누르고 있으면 소화기가 뿌려집니다. 불을 모두 꺼 봅시다.',fly:'풍선에 어떤 기체를 넣을까요? 두 버튼을 모두 눌러 봅시다.',neon:'어두운 벽에 글씨나 그림을 그려 유리관을 만들고, 전기를 켜 봅시다.',bus:'왼쪽과 오른쪽을 눌러 차선을 바꿔 봅시다. 수소를 채우며 끝까지 달려 봅시다.'})[k]}

/* ───────── 꾸미기 화면 ───────── */
function buildOpts(){
  const o=$('opts');o.innerHTML='';o.style.cssText='display:flex;flex-direction:column;gap:8px';
  const swatch=(label,arr,i)=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<span>${label}</span><div class="chips"></div>`;arr.forEach((col,k)=>{const b=document.createElement('button');b.className='sw'+(S.look[i]===k?' on':'');b.style.background=col;b.setAttribute('aria-label',`${label} ${k+1}`);b.onclick=()=>pick(i,k);r.lastChild.appendChild(b)});o.appendChild(r)};
  const chips=(label,arr,i)=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<span>${label}</span><div class="chips"></div>`;arr.forEach((t,k)=>{const b=document.createElement('button');b.className='chip'+(S.look[i]===k?' on':'');b.textContent=t;b.onclick=()=>pick(i,k);r.lastChild.appendChild(b)});o.appendChild(r)};
  swatch('피부',SKIN,0);chips('머리',HAIRS,1);swatch('머리색',HAIRC,2);chips('표정',FACES,5);swatch('윗옷',SHIRT,3);swatch('바지',PANTS,4);chips('장식',ACCS,6);
}
function pick(i,k){S.look[i]=k;setLook(me.char,S.look);buildOpts();save();sfx([600],.04)}
function openAvatar(){ui='avatar';setModal();$('avatar').classList.remove('hide');$('hud').classList.add('hide');$('nick').value=S.name;buildOpts();$('bReset').classList.toggle('hide',!S.done.some(Boolean));if(me.dance)setDance(false);me.char.state=0;}
function enter(){
  const nm=cleanName($('nick').value);S.name=$('nick').value.trim()?nm:(S.name||('탐험가'+(10+rnd(89))));save();
  $('avatar').classList.add('hide');$('hud').classList.remove('hide');ui='play';setModal();audioInit();if(ac&&ac.state==='suspended')ac.resume();
  refreshSteps();
  if(!client&&netState==='solo'&&!enter.started){enter.started=1;netStart()}
  lastSent='';
  if(!enter.greeted&&!S.done.some(Boolean)){enter.greeted=1;setTimeout(()=>{if(ui==='play')toast('광장에 온 것을 환영합니다! L 버튼을 누르면 함께 춤출 수 있습니다.',4000)},500)}
}

/* ───────── 조작 ───────── */
addEventListener('keydown',e=>{if(document.activeElement===$('nick')){if(e.key==='Enter')$('bEnter').click();return}
  keys[e.code]=true;if(e.code==='Space'){e.preventDefault();jump()}if(e.code==='KeyL'&&!e.repeat&&ui==='play'&&!modal){setDance(!me.dance)}
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));
{const el=$('stick'),kn=$('knob');
 const mv=e=>{const r=el.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2);const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}stick.x=x;stick.y=y;kn.style.transform=`translate(${x*40}px,${y*40}px)`};
 el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();stick.id=e.pointerId;try{el.setPointerCapture(e.pointerId)}catch(x){}mv(e)});
 el.addEventListener('pointermove',e=>{if(e.pointerId===stick.id)mv(e)});
 const end=e=>{if(e.pointerId===stick.id){stick.id=null;stick.x=stick.y=0;kn.style.transform=''}};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);}
{const cv=$('c');let id=null,lx=0,ly=0;
 cv.addEventListener('pointerdown',e=>{if(ui!=='play')return;id=e.pointerId;lx=e.clientX;ly=e.clientY;try{cv.setPointerCapture(id)}catch(x){}});
 cv.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;camYaw-=(e.clientX-lx)*.007;camPitch=Math.max(.12,Math.min(1.15,camPitch+(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY});
 const end=e=>{if(e.pointerId===id)id=null};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
 cv.addEventListener('wheel',e=>{e.preventDefault();camDist=Math.max(6,Math.min(22,camDist+e.deltaY*.012))},{passive:false});}
$('bJ').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
$('bL').addEventListener('click',()=>{setDance(!me.dance);sfx([880],.04);$('bL').blur()});
$('bC').addEventListener('click',()=>$('chat').classList.toggle('hide'));
PRESETS.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{chatIdx=i;chatSeq=(chatSeq+1)%1e6;say(me.char,t);$('chat').classList.add('hide');lastSent='';clearTimeout(chatOff);chatOff=setTimeout(()=>{chatIdx=-1},4000)};$('chat').appendChild(b)});
$('bBook').addEventListener('click',openBook);$('bookClose').addEventListener('click',()=>show('book',false));
$('bSnd').addEventListener('click',()=>{muted=!muted;if(mg)mg.gain.value=muted?0:.8;$('bSnd').textContent=muted?'소리 켜기':'소리 끄기'});
$('bLook').addEventListener('click',openAvatar);
$('bEnter').addEventListener('click',enter);
$('bRand').addEventListener('click',()=>{S.look=randLook();setLook(me.char,S.look);buildOpts();save()});
let resetArm=0;$('bReset').addEventListener('click',()=>{if(Date.now()-resetArm>3000){resetArm=Date.now();$('bReset').textContent='한 번 더 누르기';setTimeout(()=>$('bReset').textContent='새로 시작',3000);return}
  S.done=[0,0,0,0,0,0];save();ZONES.forEach(Z=>Z.items.forEach(it=>it.found=false));$('bReset').textContent='새로 시작';$('bReset').classList.add('hide');me.x=0;me.z=16;me.yaw=Math.PI;});

/* ───────── 그리기 반복 ───────── */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);
let lastT=performance.now();const tmpC=new THREE.Color();const camPos=new THREE.Vector3(),look=new THREE.Vector3();
function frame(){
  requestAnimationFrame(frame);
  const pn=performance.now();let dt=Math.min(.05,(pn-lastT)/1000);lastT=pn;const now=Date.now();
  /* 파티장: 박자에 맞춘 바닥 색 */
  const bt=Math.floor(now/500);
  if(bt!==lastBeat){lastBeat=bt;const pal=['#ff4f6e','#ffc824','#3fd0ff','#b9ff3c','#ff7fbd','#ffffff','#8a5cff'];
    tiles.forEach(([x,z],i)=>{const v=(Math.abs(x)+Math.abs(z)+bt*(bt%8<4?1:-1)+700)%pal.length;tileMesh.setColorAt(i,tmpC.set(pal[Math.floor(v)]))});tileMesh.instanceColor.needsUpdate=true}
  ballM.rotation.y=now/900;
  beams.forEach((b,i)=>{if(b.userData.pump){const s=1+Math.abs(Math.sin(now/500*Math.PI))*.09;b.scale.set(s,1,s);return}const a=now/1300+i*1.57;b.rotation.x=Math.cos(a)*.55;b.rotation.z=Math.sin(a)*.55});
  dancers.forEach(c=>animate(c,dt,now));
  if(star)star.position.y=9.2+Math.sin(now/400)*.25;
  /* 나 */
  step(dt,now);animate(me.char,dt,now);peersTick(dt,now);
  if(ui==='play'){zoneTick(dt,now);netTick(pn)}
  /* 음악은 파티장에 가까울수록 크게 */
  if(musicGain){const d=Math.hypot(me.x,me.z);musicGain.gain.value=Math.max(.05,.42-d*.0075)}
  for(let i=parts.length-1;i>=0;i--){const m=parts[i];m.t-=dt;m.v.y-=18*dt;m.position.addScaledVector(m.v,dt);m.rotation.x+=dt*5;if(m.t<=0){scene.remove(m);parts.splice(i,1)}}
  clouds.forEach((c,i)=>{c.position.x+=dt*(.5+i%3*.3);if(c.position.x>170)c.position.x=-170});
  /* 카메라 */
  if(ui==='avatar'||ui==='load'){
    me.char.root.rotation.y=Math.PI*0+Math.sin(now/1600)*.55;
    const wide=innerWidth>640,side=wide?1.75:0;
    const px=me.x,py=me.y+1.6,pz=me.z;
    camPos.set(px+side,py+.3,pz+6.6);look.set(px+side,py-(wide?0:1.4),pz);
    camera.position.lerp(camPos,Math.min(1,dt*6));camera.lookAt(look);
  }else{
    const cp=Math.cos(camPitch),sp=Math.sin(camPitch);
    look.set(me.x,me.y+2,me.z);
    camPos.set(me.x+Math.sin(camYaw)*cp*camDist,Math.max(.8,me.y+2+sp*camDist),me.z+Math.cos(camYaw)*cp*camDist);
    camera.position.lerp(camPos,Math.min(1,dt*10));camera.lookAt(look);
  }
  if(activeGame){activeGame.update(dt);activeGame.draw()}
  renderer.render(scene,camera);
}

/* ───────── 시작 ───────── */
function boot(){
  buildParty();buildZones();buildScenery();
  me.char=makeChar(S.look,S.name||'나',badgeBits());scene.add(me.char.root);
  camera.position.set(0,5,30);
  resize();openAvatar();
  if(TEST)window.__g={S,me,ZONES,finish,refreshSteps,peers,startGame,startQuiz,startMini,get activeGame(){return activeGame},setCam(y,p,d){camYaw=y;camPitch=p;camDist=d}};
  frame();
}
const fontWait=(document.fonts&&document.fonts.load)?Promise.race([Promise.all([document.fonts.load('40px Jua','기체 광장'),document.fonts.load('20px "Gowun Dodum"','기체')]),new Promise(r=>setTimeout(r,1800))]):Promise.resolve();
fontWait.catch(()=>{}).then(boot);
</script>
